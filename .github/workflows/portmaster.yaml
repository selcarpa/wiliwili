name: Build PortMaster

on:
  push:
  workflow_dispatch:

env:
  CFLAGS: "-march=armv8-a -mtune=generic -O2"
  CXXFLAGS: "-march=armv8-a -mtune=generic -O2"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Init nested submodules
        run: git submodule update --init --recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv-dev libwebp-dev libssl-dev libsdl2-dev \
            libcurl4-openssl-dev libgl1-mesa-dev \
            libegl1-mesa-dev libgles2-mesa-dev \
            libass-dev libuchardet-dev libfreetype-dev \
            pkg-config cmake build-essential

      - name: Apply SDL gamepad patch
        run: patch -d library/borealis -p1 < patches/borealis_sdl_gamepad.patch

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
            -DPLATFORM_DESKTOP=ON \
            -DUSE_SDL2=ON -DUSE_GLES2=ON \
            -DUSE_SYSTEM_SDL2=ON -DUSE_SYSTEM_CURL=ON \
            -DBRLS_UNITY_BUILD=ON \
            -DCMAKE_UNITY_BUILD_BATCH_SIZE=16

      - name: Build
        run: cmake --build build -j$(nproc) --target wiliwili

      - name: Package
        run: |
          PKG="wiliwili.port"
          mkdir -p "$PKG/libs" "$PKG/resources"
          cp build/wiliwili "$PKG/wiliwili.aarch64"
          strip "$PKG/wiliwili.aarch64" 2>/dev/null || true

          # Collect all runtime deps recursively (skip GPU driver libs)
          SKIP='libEGL\.\|libGLESv2\.\|libGL\.so\|libgbm\.\|libvulkan\.\|libc\.so\.\|libm\.so\.\|libstdc++\.\|libgcc_s\.\|ld-linux'
          collect() {
            ldd "$1" 2>/dev/null | awk '{print $3}' | grep -v '^\s*$' | grep -v "$SKIP"
          }
          copy_lib() {
            local src="$1" dst="$PKG/libs/$(basename "$src")"
            [ -f "$dst" ] && return 0
            cp -L "$src" "$dst" 2>/dev/null || return 1
          }
          # First pass: binary
          while IFS= read -r lib; do
            [ -z "$lib" ] && continue
            copy_lib "$lib" || true
          done < <(collect "$PKG/wiliwili.aarch64")
          # Iterate until no new libs found
          PREV=0; CURR=$(ls "$PKG/libs/" | wc -l)
          while [ "$CURR" -gt "$PREV" ]; do
            PREV=$CURR
            for f in "$PKG/libs/"*.so*; do
              while IFS= read -r lib; do
                [ -z "$lib" ] && continue
                copy_lib "$lib" || true
              done < <(collect "$f")
            done
            CURR=$(ls "$PKG/libs/" | wc -l)
          done

          echo "=== Bundled: $(ls "$PKG/libs/" | wc -l) libs ==="
          du -sh "$PKG/libs/"

          cp -r resources/* "$PKG/resources/" 2>/dev/null || true
          cp scripts/portmaster/wiliwili.sh "$PKG/"
          cp scripts/portmaster/port.json "$PKG/"
          cp scripts/portmaster/wiliwili.gptk "$PKG/"
          cp resources/icon/icon.png "$PKG/wiliwili.png"
          [ -f resources/gamepad/gamecontrollerdb.txt ] && \
            cp resources/gamepad/gamecontrollerdb.txt "$PKG/" || true
          chmod +x "$PKG/wiliwili.sh" "$PKG/wiliwili.aarch64"

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: wiliwili-Linux-aarch64-portmaster
          path: wiliwili.port/
