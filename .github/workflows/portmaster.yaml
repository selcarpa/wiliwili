name: Build PortMaster

on:
  push:
  workflow_dispatch:

env:
  CFLAGS: "-march=armv8-a -mtune=generic -O2"
  CXXFLAGS: "-march=armv8-a -mtune=generic -O2"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Init nested submodules
        run: |
          git submodule update --init --recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv-dev libwebp-dev libssl-dev libsdl2-dev \
            libcurl4-openssl-dev libgl1-mesa-dev \
            libegl1-mesa-dev libgles2-mesa-dev \
            libass-dev libuchardet-dev \
            pkg-config cmake build-essential

      - name: Apply borealis SDL gamepad patch
        run: |
          patch -d library/borealis -p1 < patches/borealis_sdl_gamepad.patch
          echo "Patch applied: SDL input now loads gamecontrollerdb.txt"

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
            -DPLATFORM_DESKTOP=ON \
            -DUSE_SDL2=ON \
            -DUSE_GLES2=ON \
            -DUSE_SYSTEM_SDL2=ON \
            -DUSE_SYSTEM_CURL=ON \
            -DBRLS_UNITY_BUILD=ON \
            -DCMAKE_UNITY_BUILD_BATCH_SIZE=16

      - name: Build
        run: |
          cmake --build build -j$(nproc) --target wiliwili

      - name: Show binary deps
        run: |
          echo "=== wiliwili direct dependencies ==="
          ldd build/wiliwili | grep -E '=>|not found'
          echo ""
          echo "=== Binary info ==="
          file build/wiliwili
          readelf -h build/wiliwili | grep -i 'machine\|entry\|class'

      - name: Package for PortMaster
        run: |
          PKG="wiliwili.port"
          mkdir -p "$PKG/libs" "$PKG/resources"

          # Copy binary
          cp build/wiliwili "$PKG/wiliwili.aarch64"

          # Get direct library dependencies
          LIBS=$(ldd build/wiliwili | awk '{print $3}' | grep -v '^$' | sort -u)

          # Only bundle app-specific libs (skip system/display/audio/gpu libs)
          BUNDLED=""
          for lib in $LIBS; do
            base=$(basename "$lib")
            case "$base" in
              # System libs - use device's own
              ld-linux*|libc.so*|libm.so*|libstdc++*|libgcc_s*|libpthread*|librt*|libdl*|libresolv*|libnss*)
                continue ;;
              # Display/GPU - use device's own
              libX*|libxcb*|libwayland*|libdecor*|libva*|libvdpau*|libEGL*|libGLES*|libGL*|libdrm*|libgbm*|libvulkan*)
                continue ;;
              # Audio - use device's own
              libpulse*|libpipewire*|libjack*|libsndio*|libasound*|libopenal*)
                continue ;;
              # DBus - use device's own
              libdbus*)
                continue ;;
              # System utilities - use device's own
              libsystemd*|libudev*|libselinux*|libcap*|libmount*|libblkid*)
                continue ;;
              # Everything else - bundle
              *)
                cp -L "$lib" "$PKG/libs/" 2>/dev/null || true
                BUNDLED="$BUNDLED $base"
                ;;
            esac
          done

          echo "=== Bundled libraries ==="
          for f in "$PKG/libs/"*.so*; do
            echo "  $(basename "$f")"
          done
          echo "Count: $(ls "$PKG/libs/" | wc -l)"

          # Copy resources
          cp -r resources/* "$PKG/resources/" 2>/dev/null || true

          # Copy launcher and metadata
          cp scripts/portmaster/wiliwili.sh "$PKG/"
          cp scripts/portmaster/port.json "$PKG/"
          cp scripts/portmaster/wiliwili.gptk "$PKG/"
          cp resources/icon/icon.png "$PKG/wiliwili.png"

          # Gamecontroller DB
          if [ -f resources/gamepad/gamecontrollerdb.txt ]; then
            cp resources/gamepad/gamecontrollerdb.txt "$PKG/"
          else
            wget -q https://raw.githubusercontent.com/gabomdq/SDL_GameControllerDB/master/gamecontrollerdb.txt \
              -O "$PKG/gamecontrollerdb.txt" || true
          fi

          chmod +x "$PKG/wiliwili.sh" "$PKG/wiliwili.aarch64"

          # Create zip
          zip -r "wiliwili-Linux-aarch64-portmaster.zip" "$PKG/"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: wiliwili-Linux-aarch64-portmaster
          path: wiliwili-Linux-aarch64-portmaster.zip
