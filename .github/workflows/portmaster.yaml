name: Build PortMaster

on:
  push:
  workflow_dispatch:

env:
  CFLAGS: "-march=armv8-a -mtune=generic -O2"
  CXXFLAGS: "-march=armv8-a -mtune=generic -O2"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Init nested submodules
        run: |
          git submodule update --init --recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv-dev libwebp-dev libssl-dev libsdl2-dev \
            libcurl4-openssl-dev libgl1-mesa-dev \
            libegl1-mesa-dev libgles2-mesa-dev \
            libass-dev libuchardet-dev \
            pkg-config cmake build-essential

      - name: Apply borealis SDL gamepad patch
        run: |
          patch -d library/borealis -p1 < patches/borealis_sdl_gamepad.patch
          echo "Patch applied: SDL input now loads gamecontrollerdb.txt"

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
            -DPLATFORM_DESKTOP=ON \
            -DUSE_SDL2=ON \
            -DUSE_GLES2=ON \
            -DUSE_SYSTEM_SDL2=ON \
            -DUSE_SYSTEM_CURL=ON \
            -DBRLS_UNITY_BUILD=ON \
            -DCMAKE_UNITY_BUILD_BATCH_SIZE=16

      - name: Build
        run: |
          cmake --build build -j$(nproc) --target wiliwili

      - name: Show binary deps
        run: |
          echo "=== wiliwili direct dependencies ==="
          ldd build/wiliwili | grep -E '=>|not found'
          echo ""
          echo "=== Binary info ==="
          file build/wiliwili
          readelf -h build/wiliwili | grep -i 'machine\|entry\|class'

      - name: Package for PortMaster
        run: |
          PKG="wiliwili.port"
          mkdir -p "$PKG/libs" "$PKG/resources"

          cp build/wiliwili "$PKG/wiliwili.aarch64"

          # Resolve the NEEDED libs to their real paths (first level only)
          resolve_lib() {
            local soname="$1"
            ldconfig -p 2>/dev/null | grep -m1 "$soname " | awk '{print $NF}'
          }

          # Only bundle these specific libs (PortMaster devices lack these)
          BUNDLE_LIST="
            libmpv.so.2
            libavcodec.so.60
            libavdevice.so.60
            libavfilter.so.9
            libavformat.so.60
            libavutil.so.58
            libswresample.so.4
            libswscale.so.7
            libpostproc.so.57
            libplacebo.so.338
            libshaderc_shared.so.1
            libcurl.so.4
            libssl.so.3
            libcrypto.so.3
            libwebp.so.7
            libsharpyuv.so.0
            libSDL2-2.0.so.0
            libuchardet.so.0
          "

          for soname in $BUNDLE_LIST; do
            libpath=$(resolve_lib "$soname")
            if [ -n "$libpath" ] && [ -f "$libpath" ]; then
              cp -L "$libpath" "$PKG/libs/"
              echo "  bundled: $soname ($(du -sh "$libpath" | cut -f1))"
            else
              echo "  NOT FOUND: $soname"
            fi
          done

          echo "=== Bundled libs: $(ls "$PKG/libs/" | wc -l) ==="

          cp -r resources/* "$PKG/resources/" 2>/dev/null || true
          cp scripts/portmaster/wiliwili.sh "$PKG/"
          cp scripts/portmaster/port.json "$PKG/"
          cp scripts/portmaster/wiliwili.gptk "$PKG/"
          cp resources/icon/icon.png "$PKG/wiliwili.png"
          chmod +x "$PKG/wiliwili.sh" "$PKG/wiliwili.aarch64"

          # strip binary
          strip "$PKG/wiliwili.aarch64" 2>/dev/null || true

          zip -r "wiliwili-Linux-aarch64-portmaster.zip" "$PKG/"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: wiliwili-Linux-aarch64-portmaster
          path: wiliwili-Linux-aarch64-portmaster.zip
